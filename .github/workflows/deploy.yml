name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd /home/ec2-user/petstore-api || {
              git clone https://github.com/deepak-sagacity/petstore-api.git /home/ec2-user/petstore-api
              cd /home/ec2-user/petstore-api
            }

            echo "Fetching latest changes..."
            git pull origin main

            echo "Installing packages..."
            npm install

            echo "Configuring Prisma and database..."
            npx prisma generate
            npx prisma db push

            echo "Building TypeScript..."
            npm run build

            echo "Reloading PM2 service..."
            if pm2 describe petstore-api > /dev/null 2>&1; then
              pm2 restart petstore-api --update-env
            else
              pm2 start dist/server.js --name "petstore-api"
            fi

            pm2 save
            echo "Deployment finished!"